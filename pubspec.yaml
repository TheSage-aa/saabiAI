name: saabi
description: "Gamified Duolingo-style health literacy app by LUMA Nigeria"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.19.0'

dependencies:
  flutter:
    sdk: flutter

  # Backend
  supabase_flutter: ^2.5.6       # Supabase client (DB + auth + realtime)
  dio: ^5.7.0                    # HTTP client for Saabi AI calls

  # Auth
  google_sign_in: ^6.2.1         # Google OAuth

  # State management
  flutter_riverpod: ^2.5.1

  # Navigation
  go_router: ^14.2.7

  # Storage
  flutter_secure_storage: ^9.2.2 # Secure user_id on mobile
  shared_preferences: ^2.3.2     # Web fallback for user_id

  # Utilities
  uuid: ^4.4.2                   # Generate stable device user_id
  google_fonts: ^6.2.1           # Typography

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
